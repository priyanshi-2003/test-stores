# PrestaShop test store: http://localhost:8082
# Run ./setup.sh rather than compose directly; it also turns on the webservice API and creates a key.
# Local test data only. Passwords are fixed on purpose.
#
# Versions (checked together on 2026-11-26):
#   PrestaShop 8.2.9 on PHP 8.1 + Apache (official image; PrestaShop 8.2 supports PHP up to 8.1)
#   MariaDB 10.11 LTS (PrestaShop 8.2 supports MySQL 5.6-8.0 / MariaDB 10.x)

name: prestashop

services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prestashop
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  prestashop:
    image: docker.io/prestashop/prestashop:8.2.9-8.1-apache
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_USER: root
      DB_PASSWD: root
      DB_NAME: prestashop
      DB_PREFIX: ps_
      # Install automatically on the first start (with the demo products and orders).
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: localhost:8082
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      PS_COUNTRY: ro
      PS_LANGUAGE: en
      PS_ENABLE_SSL: "0"
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: Admin12345!
    volumes:
      - html:/var/www/html

volumes:
  db:
  html:
