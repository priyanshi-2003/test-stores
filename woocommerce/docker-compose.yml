# WooCommerce test store: http://localhost:8081
# Run ./setup.sh rather than compose directly; it also installs WooCommerce, products and API keys.
# Local test data only. Passwords are fixed on purpose.
#
# Versions (checked together on 2026-11-26):
#   WordPress 7.1.5 on PHP 8.3 + Apache (official image)
#   MariaDB 11.4 LTS (WordPress needs MySQL >= 5.5.5 / MariaDB >= 10.4)
#   WooCommerce 11.3.1 is installed by setup.sh (needs WordPress >= 7.0, tested up to 7.1.5)

name: woocommerce

services:
  db:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  wordpress:
    image: docker.io/library/wordpress:7.1.5-php8.3-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      # "local" lets WordPress application passwords (API login) work over plain HTTP.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - html:/var/www/html

volumes:
  db:
  html:
